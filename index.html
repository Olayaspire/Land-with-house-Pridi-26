<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Condo for Sale Sukhumvit | ขายคอนโดสุขุมวิท</title>
<meta name="description" content="Luxury condo for sale in Sukhumvit. Near BTS, ready to move in. คอนโดหรูใกล้ BTS ราคาดี">

<!-- SEO -->
<meta name="robots" content="index, follow">

<!-- Swiper -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>
body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }

.container { max-width:1000px; margin:auto; padding:15px; }

/* ราคาเด่น */
.price-box {
  background:#c62828;
  color:#fff;
  padding:15px;
  border-radius:10px;
  font-size:26px;
  font-weight:bold;
  text-align:center;
  margin:15px 0;
}

/* Swiper */
.swiper { width:100%; height:260px; border-radius:10px; }
.swiper-slide img {
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

/* ปุ่มติดต่อ */
.contact-buttons {
  position:fixed;
  right:15px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:999;
}
.contact-buttons a {
  padding:12px 16px;
  border-radius:30px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
}
.call { background:#0d47a1; }
.line { background:#00c300; }
.wa { background:#25d366; }

/* ปุ่มภาษา */
.lang {
  position:fixed;
  top:10px;
  right:10px;
}
.lang button {
  padding:6px 10px;
  margin-left:5px;
}

/* Fullscreen image */
#lightbox {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
#lightbox img {
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<div class="lang">
  <button onclick="setLang('th')">TH</button>
  <button onclick="setLang('en')">EN</button>
</div>

<div class="container">

<h1 data-th="ขายคอนโดหรู สุขุมวิท ใกล้ BTS"
    data-en="Luxury Condo for Sale Sukhumvit Near BTS"></h1>

<!-- ราคา -->
<div class="price-box"
 data-th="ราคา 9,900,000 บาท"
 data-en="Price 9,900,000 THB"></div>

<!-- Gallery -->
<div class="swiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img src="img/1.jpg" alt="Living Room"></div>
    <div class="swiper-slide"><img src="img/2.jpg" alt="Bedroom"></div>
    <div class="swiper-slide"><img src="img/3.jpg" alt="Kitchen"></div>
  </div>
  <div class="swiper-pagination"></div>
</div>

<!-- รายละเอียด -->
<h2 data-th="รายละเอียดทรัพย์" data-en="Property Details"></h2>
<ul>
  <li data-th="2 ห้องนอน 2 ห้องน้ำ" data-en="2 Bedrooms 2 Bathrooms"></li>
  <li data-th="ขนาด 85 ตร.ม." data-en="Size 85 sq.m."></li>
  <li data-th="ใกล้ BTS 300 เมตร" data-en="300m from BTS"></li>
</ul>

<!-- Map -->
<h2 data-th="แผนที่" data-en="Location"></h2>
<iframe
 src="https://www.google.com/maps?q=sukhumvit&output=embed"
 width="100%" height="250" style="border:0;" loading="lazy"></iframe>

</div>

<!-- ปุ่มติดต่อ -->
<div class="contact-buttons">
  <a class="call" href="tel:0931359945">📞 CALL</a>
  <a class="line" href="https://line.me/ti/p/~yourlineid">💬 LINE</a>
  <a class="wa" href="https://wa.me/66931359945">🟢 WhatsApp</a>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img">
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
const swiper = new Swiper('.swiper', {
  pagination: { el: '.swiper-pagination' },
});

document.querySelectorAll('.swiper-slide img').forEach(img=>{
  img.onclick=()=>{
    document.getElementById('lightbox-img').src=img.src;
    document.getElementById('lightbox').style.display='flex';
  }
});

function setLang(lang){
  document.querySelectorAll('[data-th]').forEach(el=>{
    el.textContent = el.dataset[lang];
  });
}
setLang('en'); // เริ่มภาษาอังกฤษอัตโนมัติ
</script>

</body>
</html>
