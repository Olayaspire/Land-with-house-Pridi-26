<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Land with House – Pridi 26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
}

h1 {
  margin-bottom: 15px;
}

/* PRICE BOX */
.price-box {
  border: 2px solid #f5b000;
  border-radius: 15px;
  padding: 20px;
  max-width: 420px;
  background: #fffaf0;
  margin-bottom: 30px;
}

.price {
  color: #d32f2f;
  font-size: 32px;
  font-weight: bold;
}

.tags span {
  display: inline-block;
  margin: 6px 6px 0 0;
  padding: 6px 10px;
  border-radius: 20px;
  background: #fff;
  border: 1px solid #ddd;
  font-size: 14px;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.gallery img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal img {
  max-width: 95%;
  max-height: 95%;
  border-radius: 10px;
}

/* FLOAT CONTACT */
.contact {
  position: fixed;
  right: 15px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact a {
  text-decoration: none;
  color: white;
  padding: 12px 16px;
  border-radius: 30px;
  font-weight: bold;
  text-align: center;
}

.call { background:#2563eb; }
.line { background:#06c755; }
.whatsapp { background:#25d366; }

/* MAP */
.map {
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>Land with House – Pridi 26</h1>

<div class="price-box">
  <div>💰 ราคาเสนอขาย</div>
  <div class="price">17,710,000 บาท</div>
  <div>ค่าโอน 50/50</div>
  <div class="tags">
    <span>📐 77 ตร.ว.</span>
    <span>📍 สุขุมวิท 71</span>
    <span>🚆 BTS พระโขนง</span>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery">
  <img src="img.jpg" onclick="openModal(this.src)">
  <img src="img1.jpg" onclick="openModal(this.src)">
  <img src="img2.jpg" onclick="openModal(this.src)">
  <img src="img3.jpg" onclick="openModal(this.src)">
  <img src="img4.jpg" onclick="openModal(this.src)">
  <img src="img5.jpg" onclick="openModal(this.src)">
  <img src="img10.jpg" onclick="openModal(this.src)">
  <img src="img11.jpg" onclick="openModal(this.src)">
  <img src="img12.jpg" onclick="openModal(this.src)">
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<!-- MAP -->
<div class="map">
  <iframe
    src="https://www.google.com/maps?q=สุขุมวิท+71&output=embed"
    width="100%" height="300" style="border:0;" loading="lazy">
  </iframe>
</div>

<!-- CONTACT -->
<div class="contact">
  <a class="call" href="tel:0931359945">📞 Call</a>
  <a class="line" href="https://line.me/R/ti/p/@aspireproperty">💬 LINE</a>
  <a class="whatsapp" href="https://wa.me/66931359945">🟢 WhatsApp</a>
</div>

<script>
function openModal(src){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalImg").src=src;
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
